<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">

  <nav class="bg-white shadow px-6 py-4">
    <div class="flex items-center justify-between">
      <span class="font-bold text-xl">Mi sitio</span>

      <!-- Links: ocultos en mobile, visibles desde md -->
      <ul id="menu" class="hidden md:flex gap-6 text-gray-600">
        <li>Inicio</li>
        <li>Blog</li>
        <li>Contacto</li>
      </ul>

      <!-- Botón hamburguesa: visible en mobile, oculto desde md -->
      <button onclick="toggleMenu()" class="md:hidden text-gray-700 text-2xl">☰</button>
    </div>

    <!-- Menú móvil desplegable -->
    <ul id="mobile-menu" class="hidden flex-col gap-2 mt-4 text-gray-600 md:hidden">
      <li>Inicio</li>
      <li>Blog</li>
      <li>Contacto</li>
    </ul>
  </nav>

  <script>
    function toggleMenu() {
      const m = document.getElementById('mobile-menu');
      m.classList.toggle('hidden');
      m.classList.toggle('flex');
    }
  </script>


</body>
</html>
